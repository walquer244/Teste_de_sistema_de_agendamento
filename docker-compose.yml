version: '3.8'

services:
  # PHP Application Container
  app:
    build:
      context: ./tattoo_studio
      dockerfile: Dockerfile
    container_name: tattoo_studio_app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: tattoo_studio
      DB_USERNAME: tattoo_user
      DB_PASSWORD: tattoo_password
    volumes:
      - ./tattoo_studio:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    networks:
      - tattoo_network
    depends_on:
      - db

  # Nginx Web Server Container
  webserver:
    image: nginx:alpine
    container_name: tattoo_studio_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./tattoo_studio:/var/www
      - ./tattoo_studio/docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - tattoo_network
    depends_on:
      - app

  # MySQL 8.0 Database Container
  db:
    image: mysql:8.0
    container_name: tattoo_studio_db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: tattoo_studio
      MYSQL_USER: tattoo_user
      MYSQL_PASSWORD: tattoo_password
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - tattoo_network

  # PhpMyAdmin Interface for MySQL
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: tattoo_studio_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    networks:
      - tattoo_network
    depends_on:
      - db

networks:
  tattoo_network:
    driver: bridge

volumes:
  dbdata:
    driver: local
